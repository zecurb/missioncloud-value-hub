services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: valuehub
      POSTGRES_USER: valuehub
      POSTGRES_PASSWORD: valuehub
    ports:
      - "5432:5432"
    volumes:
      - valuehub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuehub -d valuehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://valuehub:valuehub@postgres:5432/valuehub
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  valuehub-postgres:
