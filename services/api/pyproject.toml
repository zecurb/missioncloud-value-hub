[project]
name = "missioncloud-value-hub-api"
version = "0.1.0"
description = "API for the MissionCloud Value Hub FinOps platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "duckdb>=1.1,<2.0",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.128,<1.0",
  "polars>=1.0,<3.0",
  "psycopg[c]>=3.2,<4.0",
  "pyarrow>=18.0,<26.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.7,<3.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/missioncloud_value_hub"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=missioncloud_value_hub --cov-report=term-missing"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["missioncloud_value_hub"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
